name: estacion_meteorologica
description: Aplicación Flutter para monitoreo desde Arduino (Bluetooth / USB serial)
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.5
  flutter_blue_plus: ^1.4.0
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^10.4.0
  sqflite: ^2.2.8+4
  path_provider: ^2.0.14
  path: ^1.9.1
  shared_preferences: ^2.1.1
  fl_chart: ^1.1.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
