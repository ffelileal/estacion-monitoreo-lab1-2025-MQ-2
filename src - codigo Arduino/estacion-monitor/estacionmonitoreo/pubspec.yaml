name: estacion_meteorologica
description: Aplicación Flutter para monitoreo desde Arduino (Bluetooth / USB serial)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  cupertino_icons: ^1.0.2
  provider: ^6.0.5

  # Bluetooth (BLE)
  flutter_blue_plus: ^1.36.8

  # Permissions
  permission_handler: ^12.0.1

  # Persistence, utils and UI
  sqflite: ^2.2.8+4
  path_provider: ^2.0.14
  path: ^1.8.3
  shared_preferences: ^2.1.1
  fl_chart: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.1
  # Necesario para que las pruebas de sqflite funcionen
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
